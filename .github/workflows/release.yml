name: release

# Build release artifacts and publish them:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - macOS dmg (Apple silicon) via scripts/package-macos.sh
# then create an immutable GitHub Release and update a signed stable/beta
# channel pointer. R2 mirroring is optional and never changes client trust.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch (builds + uploads artifacts, no release/R2 publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Update metadata is fetched from a fixed GitHub release (`channel-stable`
  # or `channel-beta`); each signed manifest points at immutable vX artifacts.
  ZERON_UPDATE_URL: https://github.com/rarebek/zeron/releases/download
  ZERON_UPDATE_PUBLIC_KEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: production update key guard
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -n "$ZERON_UPDATE_PUBLIC_KEY" || { echo "missing UPDATE_SIGNING_PUBLIC_KEY"; exit 1; }
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  # macOS supports two release modes:
  #   - community: no Apple credentials; the app is ad-hoc signed and the
  #     Ed25519 release manifest is the publisher trust root.
  #   - notarized: all Apple credentials are present; Developer ID signing,
  #     notarization, and stapling are mandatory.
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD — base64 "Developer ID Application"
  #     certificate + private key (.p12) and its export password.
  #   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID — App Store Connect API
  #     key (raw .p8 contents), for notarytool. All three present → the package
  #     script notarizes and staples the app + dmg (no Gatekeeper warning).
  macos:
    runs-on: macos-latest # Apple silicon
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: release credential guard
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$ZERON_UPDATE_PUBLIC_KEY" || { echo "missing UPDATE_SIGNING_PUBLIC_KEY"; exit 1; }
          fi

          apple_values=(
            "$MACOS_CERT_P12" "$MACOS_CERT_PASSWORD" "$AC_API_KEY_P8"
            "$AC_API_KEY_ID" "$AC_API_ISSUER_ID"
          )
          present=0
          for value in "${apple_values[@]}"; do
            [[ -n "$value" ]] && present=$((present + 1))
          done
          if (( present != 0 && present != ${#apple_values[@]} )); then
            echo "Apple release credentials must be configured all together or omitted for a community release"
            exit 1
          fi
          if (( present == 0 )); then
            echo "Building free community release (ad-hoc signed; no Apple notarization)"
          else
            echo "Building Developer ID signed and notarized release"
          fi
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: package dmg
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/*.dmg
            target/package/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b57dde68ee5964dccc025437b5478a5b
      UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/
          ls dist/ | grep -q "zeron-$ver-" \
            || { echo "tag v$ver does not match built artifact versions — bump Cargo.toml [workspace.package] version"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          if [[ "$ver" == *-* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
          fi
      - name: sign release manifest
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY" || { echo "missing UPDATE_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$ZERON_UPDATE_PUBLIC_KEY" || { echo "missing UPDATE_SIGNING_PUBLIC_KEY"; exit 1; }
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/update-signing.pem"
          chmod 600 "$RUNNER_TEMP/update-signing.pem"

          derived_public=$(openssl pkey -in "$RUNNER_TEMP/update-signing.pem" -pubout -outform DER \
            | tail -c 32 | base64 -w0)
          test "$derived_public" = "$ZERON_UPDATE_PUBLIC_KEY" \
            || { echo "update signing public/private keys do not match"; exit 1; }

          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          artifact_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          manifest=$(jq -n \
            --argjson schemaVersion 1 \
            --arg channel "$CHANNEL" \
            --arg version "$VERSION" \
            --arg publishedAt "$published_at" \
            --arg artifactBaseUrl "$artifact_base_url" \
            '{schemaVersion:$schemaVersion,channel:$channel,version:$version,publishedAt:$publishedAt,artifactBaseUrl:$artifactBaseUrl,files:{}}')
          for f in dist/*; do
            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            size=$(stat -c '%s' "$f")
            manifest=$(jq --arg name "$name" --arg sha "$sha" --argjson size "$size" \
              '.files[$name] = {sha256:$sha,size:$size}' <<<"$manifest")
          done
          jq -cS . <<<"$manifest" > manifest.json
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/update-signing.pem" \
            -in manifest.json -out manifest.signature
          base64 -w0 manifest.signature > manifest.json.sig
          rm -f manifest.signature "$RUNNER_TEMP/update-signing.pem"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            manifest.json
            manifest.json.sig
          generate_release_notes: true
          prerelease: ${{ env.CHANNEL == 'beta' }}
          make_latest: ${{ env.CHANNEL == 'stable' }}
      - name: publish signed channel pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel_tag="channel-$CHANNEL"
          gh release view "$channel_tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$channel_tag" -R "$GITHUB_REPOSITORY" \
              --title "Zeron $CHANNEL channel" \
              --notes "Signed pointer to the current $CHANNEL release." --latest=false
          gh release upload "$channel_tag" manifest.json manifest.json.sig \
            -R "$GITHUB_REPOSITORY" --clobber
      - name: upload to R2 (zeron.sh/releases/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for f in dist/*; do
            npx wrangler@4 r2 object put "comet-native-releases/artifacts/$(basename "$f")" \
              --file "$f" --remote
          done
          npx wrangler@4 r2 object put "comet-native-releases/channel-$CHANNEL/manifest.json" \
            --file manifest.json --remote
          npx wrangler@4 r2 object put "comet-native-releases/channel-$CHANNEL/manifest.json.sig" \
            --file manifest.json.sig --remote
